{% extends 'base.html' %}

{% block title %}Quality Check - Inter Emirates ERP{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Quality Check</h1>
        <p class="text-gray-600 dark:text-gray-400">Perform quality check for {{ work_order.order_number }}</p>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 border border-gray-200 dark:border-gray-700">
        <form method="post">
            {% csrf_token %}
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">QC Result</label>
                    <div class="mt-2 space-x-4">
                        <label class="inline-flex items-center">
                            <input type="radio" name="qc_passed" value="true" class="text-blue-600 focus:ring-blue-500">
                            <span class="ml-2 text-green-600 dark:text-green-400">Pass</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="qc_passed" value="false" class="text-blue-600 focus:ring-blue-500">
                            <span class="ml-2 text-red-600 dark:text-red-400">Fail</span>
                        </label>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">QC Notes</label>
                    <textarea name="qc_notes" rows="4" 
                              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                              placeholder="Enter quality check observations..."></textarea>
                </div>
            </div>
            
            <div class="mt-6 flex justify-end space-x-3">
                <a href="{% url 'work-order-detail' work_order.pk %}" 
                   class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-200 hover:bg-gray-300 rounded-md transition-colors">
                    Cancel
                </a>
                <button type="submit" 
                        class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-md transition-colors">
                    Submit QC
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
